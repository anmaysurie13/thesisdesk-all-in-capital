# Vercel Hobby crons run at most once a day, so the queue worker is also triggered here every 5 minutes
# (GitHub may delay scheduled runs under load). Intake also kicks the worker immediately via after().
name: queue-worker
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Call authenticated worker endpoint
        env:
          APP_URL: ${{ secrets.APP_URL }}
          WORKER_SECRET: ${{ secrets.WORKER_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$WORKER_SECRET" ]; then echo "APP_URL/WORKER_SECRET secrets not set"; exit 0; fi
          curl -sS --max-time 300 -X POST -H "Authorization: Bearer $WORKER_SECRET" "$APP_URL/api/worker/tick"
